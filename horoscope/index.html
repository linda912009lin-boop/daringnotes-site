<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日星座運勢｜daringnotes.com</title>
  <meta name="description" content="每日十二星座運勢，由 AI 每天早上自動更新。">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9172120437326791"
     crossorigin="anonymous"></script>
  <style>
    :root{--bg:#ffffff;--ink:#1e1f22;--muted:#5b6475;--bd:#e5e7f0;--card:#f7f8fb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang TC","Noto Sans TC",sans-serif}
    header,footer{padding:14px 18px;border-bottom:1px solid var(--bd);background:#fff}
    header{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .brand{font-weight:800;font-size:18px}
    .nav a{margin-right:12px;color:#334155;text-decoration:none}
    main{max-width:1100px;margin:auto;padding:20px}
    .muted{color:#64748b}
    .badge{background:#eef2ff;color:#3730a3;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:6px}
    .date-info{font-size:14px;color:var(--muted);margin:4px 0 18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:12px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
    .card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .symbol{font-size:28px;line-height:1}
    .sign-name{font-weight:700;font-size:17px}
    .sign-dates{font-size:12px;color:var(--muted)}
    .stars{color:#f59e0b;font-size:15px;margin-bottom:8px}
    .section{margin-top:8px;font-size:14px}
    .section b{color:#334155}
    .advice{margin-top:10px;padding:8px 12px;background:#fff7ed;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;font-size:13px;color:#92400e}
    .loading{text-align:center;padding:60px;color:var(--muted);font-size:15px}
    .error{text-align:center;padding:40px;color:#dc2626}
  </style>
</head>
<body>
<header>
  <div class="brand">🎵 音符探險館 <span style="font-size:13px;color:#64748b">daringnotes.com</span></div>
  <nav class="nav">
    <a href="../index.html">首頁 Home</a>
    <a href="../about.html">關於我們 About</a>
    <a href="../contact.html">聯絡方式 Contact</a>
    <a href="../privacy-policy.html">隱私權政策 Privacy</a>
  </nav>
</header>

<main>
  <h1>每日星座運勢 <span class="badge">AI 自動更新</span></h1>
  <div id="date-info" class="date-info muted">載入中…</div>
  <div id="grid" class="grid"><div class="loading">⏳ 載入運勢中…</div></div>
</main>

<footer>
  <div>© 2025 音符探險館 | daringnotes.com | 僅供娛樂參考 <span class="muted" style="font-size:13px">For entertainment only.</span></div>
</footer>

<script>
const STARS = n => '★'.repeat(n) + '☆'.repeat(5 - n);

fetch('./data.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    const dateEl = document.getElementById('date-info');
    const gridEl = document.getElementById('grid');

    if (!data.signs || data.signs.length === 0) {
      dateEl.textContent = '運勢尚未生成，請明天再來。';
      gridEl.innerHTML = '';
      return;
    }

    dateEl.textContent = `${data.date} 星座運勢　更新時間：${data.generated_at ? data.generated_at.replace('T', ' ').slice(0, 16) : ''}`;

    gridEl.innerHTML = data.signs.map(s => `
      <div class="card">
        <div class="card-head">
          <span class="symbol">${s.symbol}</span>
          <div>
            <div class="sign-name">${s.name}</div>
            <div class="sign-dates">${s.dates}</div>
          </div>
        </div>
        <div class="stars">${STARS(s.stars || 3)} <span style="font-size:12px;color:#64748b">${s.stars}/5</span></div>
        <div class="section"><b>整體：</b>${s.overall}</div>
        <div class="section"><b>愛情：</b>${s.love}</div>
        <div class="section"><b>事業：</b>${s.career}</div>
        <div class="advice">💡 ${s.advice}</div>
      </div>
    `).join('');
  })
  .catch(err => {
    document.getElementById('date-info').textContent = '';
    document.getElementById('grid').innerHTML = `<div class="error">載入失敗，請稍後再試。(${err.message})</div>`;
  });
</script>
</body>
</html>
